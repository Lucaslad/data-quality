# ==============================================================================
# Configuração do Motor de Data Quality (Local / AWS Glue)
#
# Modelo Híbrido (Auto-Learn + Override Opcional):
# Por padrão (`"auto"`), o motor aprende SOZINHO todas as métricas e regras a partir
# do histórico de partições e das fotografias na camada Bronze/Silver:
#   1. Chaves primárias (auto-descoberta de colunas identificadoras 100% únicas).
#   2. Volumetria histórica (mediana, MAD e tolerância de desvio relativo aprendida).
#   3. Evolução entre fotografias (quais colunas evoluem no passado vs. imutáveis).
#   4. Consistência data vs. partição (quais datas pertencem estritamente à safra).
#   5. Maturação de datas (quais datas são eventos diários, lag de estabilização,
#      curva por lag, janela de avaliação e tolerância de desvio).
#   6. Completude (limite máximo de nulos aprendido por coluna).
#   7. Domínio categórico (vocabulário recorrente válido e mix histórico de categorias).
#   8. Intervalo numérico (limites [min, max] aprendidos de partições estáveis).
#   9. Formato / Regex (inferência de máscara estrutural como CPF e dígitos repetidos).
#
# Caso deseje travar uma regra fixa de contrato para alguma coluna específica,
# basta substituir `"auto"` pelo dicionário/valor explícito correspondente.
# ==============================================================================

configuracoes_gerais:
  diretorio_origem: "dados/origem"
  diretorio_saida: "dados/saida"
  data_referencia_padrao: "2026-10-30"

tabelas:
  # ----------------------------------------------------------------------------
  # 1. Base Mensal Limpa (Abertura de Conta / Faturas / Chave Pix com atraso de 3 dias)
  # ----------------------------------------------------------------------------
  tabela_particao_mensal:
    ativo: true
    descricao: "Base mensal de clientes (partição = anomes de abertura), com aprendizado 100% automático"
    caminho_relativo: "tabela_particao_mensal"
    coluna_particao: "anomes"
    tipo_particao: "mensal"
    chaves_primarias: "auto"
    checks:
      particao:
        volumetria_historica:
          ativo: true
          desvio_relativo_max: "auto"
          z_score_robusto_max: "auto"
        evolucao_fotografias:
          ativo: true
          permitir_atualizacao_particoes_passadas: "auto"
          queda_max_registros_pct: "auto"
          colunas_evolucao_positiva: "auto"
        consistencia_data_particao:
          ativo: true
          colunas_data_particao: "auto"
      maturacao_datas:
        ativo: "auto"
        colunas: "auto"
      colunas:
        completude:
          ativo: true
          limites_nulos_pct: "auto"
        unicidade:
          ativo: true
          verificar_chave_primaria: true
          verificar_linha_completa: true
        dominio:
          ativo: true
          regras: "auto"
        intervalo_numerico:
