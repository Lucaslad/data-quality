# ==============================================================================
# Configuração do Motor de Data Quality (Local / AWS Glue)
#
# Modelo Híbrido (Auto-Learn + Override Opcional):
# Por padrão (`"auto"`), o motor aprende SOZINHO todas as métricas e regras a partir
# do histórico de partições e das fotografias na camada Gold:
#   1. Chaves primárias (auto-descoberta de colunas identificadoras simples ou compostas).
#   2. Contrato de Schema / Schema Drift (colunas obrigatórias, tipos e colunas extras).
#   3. Freshness / SLA de chegada e continuidade na sequência de partições.
#   4. Volumetria histórica (mediana, MAD, janela móvel, sazonalidade semanal e duplo estágio).
#   5. Evolução entre fotografias (quais colunas evoluem no passado vs. imutáveis).
#   6. Consistência data vs. partição (quais datas pertencem estritamente à safra).
#   7. Maturação de datas (quais datas são eventos diários, lag de estabilização,
#      curva por lag, janela de avaliação e tolerância de desvio).
#   8. Completude (limite máximo de nulos aprendido por coluna).
#   9. Domínio categórico e Distribution Drift (vocabulário válido e PSI/JSD do mix histórico).
#  10. Intervalo numérico (limites [min, max] aprendidos com escala log10 dinâmica).
#  11. Formato / Regex vetorizado e Dígito Verificador Módulo 11 (CPF/CNPJ).
#  12. Consistência relacional entre colunas (Cross-Column, ex.: precedência de datas).
# ==============================================================================

configuracoes_gerais:
  diretorio_origem: "dados/origem"
  diretorio_saida: "dados/saida"
  data_referencia_padrao: "2026-10-30"
  # Leitura Incremental de Partições:
  # - Quando `true`, evita reler arquivos Parquet de partições antigas que já são GOLD e não mudaram no disco/S3.
  leitura_incremental: true
  janela_leitura_recente_diaria: 5
  janela_leitura_recente_mensal: 2
  # Processamento em Streaming de Memória (AWS Glue):
  # - Quando `true`, extrai o perfil estatístico completo ao ler cada partição e libera o DataFrame da RAM imediatamente.
  modo_streaming_memoria: false
  # Particionamento de Metadados (_metadados_dq/particionado/):
  # - Evita race conditions em execuções concorrentes no AWS Glue.
  particionar_metadados: true
  # Observabilidade / Logging ("console" para terminal local ou "json" para AWS CloudWatch):
  formato_log: "console"
  nivel_log: "INFO"
  # Roteamento Medallion e Score Ponderado:
  roteamento_e_score:
    limite_max_anomalias_silver: 6
    teto_score_bronze: 65.0
    checks_estruturais_criticos:
      - "consistencia_schema"
      - "freshness_particao"
      - "unicidade_chave_primaria"
      - "unicidade_linha_completa"
      - "volumetria_historica"
      - "evolucao_fotografias"
    pesos_checks:
      consistencia_schema: 3.0
      unicidade_chave_primaria: 3.0
      volumetria_historica: 3.0
      evolucao_fotografias: 3.0
      unicidade_linha_completa: 2.5
      freshness_particao: 2.5
      consistencia_data_particao: 2.0
      completude: 1.5
      consistencia_entre_colunas: 1.5
      dominio: 1.0
      drift_distribuicao: 1.0
      intervalo_numerico: 1.0
      formato_regex: 1.0
      digito_verificador: 1.0
  # Integração pós-roteamento com Catálogo (AWS Glue Data Catalog / Apache Iceberg):
  integracao_catalogo:
    ativo: false
    tipo: "glue"
    database_gold: "dq_gold_db"
    database_silver: "dq_silver_db"
    database_bronze: "dq_bronze_db"

