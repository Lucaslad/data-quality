[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-engine"
version = "2.0.0"
description = "Motor de Data Quality com Auto-Aprendizado Blindado (GOLD), Auditoria de Reprocessamento e Roteamento Medallion para Local / AWS Glue"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.34.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
